services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  programs:
    build: ./services/programs
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/openworkout_programs
      ADMIN_API_KEY: dev-admin-key
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  exercises:
    build: ./services/exercises
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/openworkout_exercises
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"

  web:
    build: ./apps/web
    expose:
      - "80"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - programs
      - exercises

volumes:
  pgdata:
